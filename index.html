<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerCopy — Uski handwriting wala assignment</title>
<style>
  @font-face { font-family: 'HerHand'; src: url('QEDaveMergens.ttf') format('truetype'); }
  :root {
    --ink-blue: #2e3d9e;
    --ink-red: #cf3527;
    --frame-green: #2e8b72;
    --paper: #fffdf6;
    --bg: #f3eee3;
    --card: #fffdf8;
    --text: #23201a;
    --accent: #b3541e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: .2px; }
  .tag { margin: 0 0 22px; color: #5c5546; font-size: 16px; }
  .card { background: var(--card); border: 1px solid #e2dac6; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(60,50,20,.06); }
  label.lbl { display: block; font-weight: bold; margin: 0 0 8px; font-size: 15px; }
  textarea { width: 100%; min-height: 190px; padding: 12px; font: 16px/1.5 Georgia, serif; border: 1px solid #cfc6ab; border-radius: 10px; background: #fff; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 13px; color: #7a7261; margin: 6px 0 0; }
  .toggleRow { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; }
  .toggleRow .tlabel { font-size: 16px; font-weight: bold; }
  .switch { position: relative; width: 52px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; background: #cfc6ab; border-radius: 999px; transition: background .2s; pointer-events: none; }
  .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 27px; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  #details { display: none; margin-top: 12px; padding: 14px; border: 1px dashed #cfc6ab; border-radius: 10px; background: #fff; }
  #details.open { display: block; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .fields label { font-size: 13px; font-weight: bold; display: block; }
  .fields input { width: 100%; margin-top: 4px; padding: 8px 10px; font: 15px Georgia, serif; border: 1px solid #cfc6ab; border-radius: 8px; }
  .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button { font: bold 16px Georgia, serif; padding: 12px 22px; border-radius: 10px; border: 1px solid var(--accent); cursor: pointer; }
  #makeBtn { background: var(--accent); color: #fff; }
  #printBtn { background: #fff; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #pageInfo { margin: 14px 0 0; font-size: 14px; color: #5c5546; min-height: 18px; }
  #pages { margin-top: 18px; display: flex; flex-direction: column; gap: 26px; align-items: center; }

  /* ---- the A4 sheet, layout copied from her copy ---- */
  .page { position: relative; width: 794px; max-width: 100%; aspect-ratio: 794 / 1123; background: var(--paper);
         box-shadow: 0 4px 24px rgba(60,50,20,.14); overflow: hidden; flex: 0 0 auto; }
  .frame { position: absolute; inset: 26px; border: 2px solid var(--frame-green); pointer-events: none; }
  .marginLine { position: absolute; top: 26px; bottom: 26px; left: 64px; width: 2px; background: var(--frame-green); pointer-events: none; }
  .sheet { position: absolute; top: 46px; bottom: 40px; left: 84px; right: 46px; font-family: 'HerHand', cursive; }
  .pageno { position: absolute; bottom: 34px; right: 52px; font-family: 'HerHand', cursive; font-size: 15px; color: var(--ink-blue); opacity: .75; }
  .detailsBlock { color: var(--ink-blue); font-size: 19px; line-height: 1.65; margin-bottom: 10px; }
  .heading { color: var(--ink-red); font-size: 27px; text-align: center; text-decoration: underline; text-underline-offset: 5px; margin: 2px 0 14px; line-height: 1.3; }
  .line { color: var(--ink-blue); font-size: 21px; line-height: 36px; white-space: nowrap; }
  .line .ch { display: inline-block; }
  .line img.glyph { display: inline-block; vertical-align: baseline; }

  @media print {
    body { background: #fff; }
    .noPrint { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    #pages { margin: 0; gap: 0; }
    .page { box-shadow: none; width: 210mm; height: 297mm; aspect-ratio: auto; page-break-after: always; }
    @page { size: A4; margin: 0; }
  }
  @media (max-width: 640px) { .fields { grid-template-columns: 1fr; } h1 { font-size: 27px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="noPrint">
    <h1>HerCopy</h1>
    <p class="tag">Uski handwriting wala assignment — bas text daalo, pages ready. Print karke hard copy bana lo.</p>
    <div class="card">
      <label class="lbl" for="src">Assignment ka text</label>
      <textarea id="src" placeholder="Yahan apna assignment type ya paste karo..."></textarea>
      <p class="hint">Pehli line heading banegi — laal ink me, usi ki copy ki tarah. Baaki sab neeli ink me.</p>

      <div class="toggleRow">
        <span class="switch"><input type="checkbox" id="detailsToggle"><span class="track"></span></span>
        <span class="tlabel">Pehle page par Name / Roll No. wagairah chahiye?</span>
      </div>
      <div id="details">
        <div class="fields">
          <label>Name <input id="fName" type="text" autocomplete="off"></label>
          <label>Class <input id="fClass" type="text" autocomplete="off"></label>
          <label>Roll No. <input id="fRoll" type="text" autocomplete="off"></label>
          <label>Subject <input id="fSubject" type="text" autocomplete="off"></label>
          <label>Date <input id="fDate" type="text" autocomplete="off"></label>
        </div>
      </div>

      <div class="actions">
        <button id="makeBtn" type="button">Pages banao</button>
        <button id="printBtn" type="button" disabled>Print / PDF download karo</button>
      </div>
      <p id="pageInfo"></p>
    </div>
  </div>
  <div id="pages"></div>
</div>

<script>
(function () {
  // Her real letters, once extracted from her page photo, land in glyphs.json
  // as { "a": ["data:image/png;base64,...", ...], ... } and take over per-letter.
  var GLYPHS = null;
  fetch('glyphs.json').then(function (r) { return r.ok ? r.json() : null; })
    .then(function (g) { GLYPHS = g; }).catch(function () { GLYPHS = null; });

  var CHARS_PER_LINE = 60;
  var LINES_PAGE1 = 24, LINES_PAGE = 27;

  function jitterChar(ch) {
    if (GLYPHS && GLYPHS[ch] && GLYPHS[ch].length) {
      var opts = GLYPHS[ch];
      var pick = opts[Math.floor(Math.random() * opts.length)];
      var img = document.createElement('img');
      img.className = 'glyph';
      img.alt = ch;
      if (typeof pick === 'string') {
        img.src = pick;
      } else {
        img.src = pick.src;
        // h = her letter scaled to this page's x-height; dy = baseline shift
        // (positive drops descenders like p/g/y below the line, as she writes).
        if (pick.h) img.style.height = pick.h + 'px';
        var dy = typeof pick.dy === 'number' ? pick.dy : 0;
        var rot = (Math.random() * 2.4 - 1.2).toFixed(2);
        img.style.transform = 'translateY(' + dy + 'px) rotate(' + rot + 'deg)';
        img.style.opacity = (0.88 + Math.random() * 0.12).toFixed(2);
      }
      return img;
    }
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = ch;
    var rot = (Math.random() * 2.4 - 1.2).toFixed(2);
    var dy = (Math.random() * 2 - 1).toFixed(1);
    var op = (0.86 + Math.random() * 0.14).toFixed(2);
    s.style.transform = 'rotate(' + rot + 'deg) translateY(' + dy + 'px)';
    s.style.opacity = op;
    return s;
  }

  function makeLine(text) {
    var div = document.createElement('div');
    div.className = 'line';
    for (var i = 0; i < text.length; i++) {
      if (text[i] === ' ') { div.appendChild(document.createTextNode('\u00A0')); }
      else { div.appendChild(jitterChar(text[i])); }
    }
    if (!text.length) div.innerHTML = '&nbsp;';
    return div;
  }

  // Her cut-out letters are wider than font letters, so lines wrap by
  // measured pixel width (her variant widths are baked into glyphs.json),
  // not by character count — otherwise glyph-heavy lines spill off the page.
  var LINE_BUDGET = 640;
  function charW(ch) {
    if (GLYPHS && GLYPHS[ch] && GLYPHS[ch].length) {
      var opts = GLYPHS[ch], sum = 0, n = 0;
      for (var i = 0; i < opts.length; i++) {
        if (typeof opts[i] !== 'string' && opts[i].w) { sum += opts[i].w; n++; }
      }
      if (n) return sum / n + 1.5;
    }
    return 10.4;
  }
  function textW(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) w += s[i] === ' ' ? 6 : charW(s[i]);
    return w;
  }
  function wrap(text) {
    var words = text.split(/\s+/).filter(Boolean);
    var lines = [], cur = '';
    words.forEach(function (w) {
      var next = cur ? cur + ' ' + w : w;
      if (textW(next) <= LINE_BUDGET || !cur) { cur = next; }
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function buildPages() {
    var raw = document.getElementById('src').value.replace(/\r\n/g, '\n');
    var pagesEl = document.getElementById('pages');
    pagesEl.innerHTML = '';
    var info = document.getElementById('pageInfo');
    var printBtn = document.getElementById('printBtn');

    var allLines = raw.split('\n');
    var heading = (allLines[0] || '').trim();
    var bodyText = allLines.slice(1).join('\n');

    // Body -> wrapped lines, keeping blank lines as paragraph gaps
    var bodyLines = [];
    bodyText.split('\n').forEach(function (para) {
      if (!para.trim()) { bodyLines.push(''); return; }
      wrap(para.trim()).forEach(function (l) { bodyLines.push(l); });
    });
    while (bodyLines.length && bodyLines[bodyLines.length - 1] === '') bodyLines.pop();

    var withDetails = document.getElementById('detailsToggle').checked;
    var detailLines = [];
    if (withDetails) {
      var v = function (id) { return document.getElementById(id).value.trim(); };
      if (v('fName')) detailLines.push('Name : ' + v('fName'));
      if (v('fClass')) detailLines.push('Class : ' + v('fClass'));
      if (v('fRoll')) detailLines.push('Roll No. : ' + v('fRoll'));
      if (v('fSubject')) detailLines.push('Subject : ' + v('fSubject'));
      if (v('fDate')) detailLines.push('Date : ' + v('fDate'));
    }

    var chunks = [];
    var firstCap = LINES_PAGE1 - (withDetails ? detailLines.length + 1 : 0);
    var i = 0;
    chunks.push(bodyLines.slice(0, Math.max(firstCap, 1))); i = Math.max(firstCap, 1);
    while (i < bodyLines.length) { chunks.push(bodyLines.slice(i, i + LINES_PAGE)); i += LINES_PAGE; }
    if (!chunks.length) chunks = [[]];

    chunks.forEach(function (chunk, p) {
      var page = document.createElement('div'); page.className = 'page';
      var frame = document.createElement('div'); frame.className = 'frame';
      var ml = document.createElement('div'); ml.className = 'marginLine';
      var sheet = document.createElement('div'); sheet.className = 'sheet';
      if (p === 0) {
        if (detailLines.length) {
          var db = document.createElement('div'); db.className = 'detailsBlock';
          detailLines.forEach(function (d) {
            var ln = document.createElement('div');
            for (var k = 0; k < d.length; k++) ln.appendChild(d[k] === ' ' ? document.createTextNode('\u00A0') : jitterChar(d[k]));
            db.appendChild(ln);
          });
          sheet.appendChild(db);
        }
        if (heading) {
          var h = document.createElement('div'); h.className = 'heading';
          h.textContent = heading;
          sheet.appendChild(h);
        }
      }
      chunk.forEach(function (l) { sheet.appendChild(makeLine(l)); });
      var pn = document.createElement('div'); pn.className = 'pageno';
      pn.textContent = (p + 1) + ' / ' + chunks.length;
      page.appendChild(frame); page.appendChild(ml); page.appendChild(sheet); page.appendChild(pn);
      pagesEl.appendChild(page);
    });

    info.textContent = 'Ready hai — kul ' + chunks.length + ' page bane. Print par A4 plain paper use karna, scale 100%.';
    printBtn.disabled = false;
  }

  document.getElementById('makeBtn').addEventListener('click', buildPages);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  document.getElementById('detailsToggle').addEventListener('change', function (e) {
    document.getElementById('details').className = e.target.checked ? 'open' : '';
  });
})();
</script>
</body>
</html>
